<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <!-- Слева: Docker Контейнер -->
  <g transform="translate(40, 10)">
    <rect width="340" height="180" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="170" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Docker (Контейнеризация ОС)</text>
    
    <g transform="translate(30, 42)">
      <rect x="0" y="0" width="280" height="24" rx="3" fill="#ffffff" stroke="#1f2328"/>
      <text x="140" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle">Прикладной код (App)</text>

      <rect x="0" y="28" width="280" height="24" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
      <text x="140" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#59636e" text-anchor="middle">Системные библиотеки Linux (glibc, musl)</text>

      <rect x="0" y="56" width="280" height="24" rx="3" fill="#ffebe9" stroke="#cf222e"/>
      <text x="140" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#cf222e" text-anchor="middle">Слой ядра Linux (Namespaces, cgroups)</text>

      <rect x="0" y="84" width="280" height="24" rx="3" fill="#1f2328"/>
      <text x="140" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fff" text-anchor="middle">Хостовая ОС и Железо</text>
    </g>

    <text x="30" y="166" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cf222e">Размер: 50–500 МБ | Старт: 200–500 мс</text>
  </g>

  <!-- Справа: WebAssembly + WASI -->
  <g transform="translate(470, 10)">
    <rect width="340" height="180" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="2"/>
    <text x="170" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Wasm + WASI (Изоляция VM)</text>
    
    <g transform="translate(30, 42)">
      <rect x="0" y="0" width="280" height="34" rx="3" fill="#ffffff" stroke="#1f2328"/>
      <text x="140" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#0969da" text-anchor="middle">Байткод Wasm (.wasm)</text>

      <rect x="0" y="40" width="280" height="38" rx="3" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
      <text x="140" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#1a7f37" text-anchor="middle">Изолированная VM (WASI 0.2)</text>
      <text x="140" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#59636e" text-anchor="middle">Изоляция на уровне команд CPU</text>

      <rect x="0" y="84" width="280" height="24" rx="3" fill="#1f2328"/>
      <text x="140" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fff" text-anchor="middle">Хостовая ОС и Железо</text>
    </g>

    <text x="30" y="166" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#1a7f37" font-weight="bold">Размер: 50 КБ – 2 МБ | Старт: &lt; 1 мс</text>
  </g>
</svg>
