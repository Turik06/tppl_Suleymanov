<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#000" />
    </marker>
  </defs>

  <!-- Блок 1: Линейная память -->
  <g transform="translate(10, 10)">
    <rect width="440" height="180" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="220" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Линейная память (Linear Memory)</text>
    <text x="220" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#59636e" text-anchor="middle">Непрерывный массив байт (в JS: WebAssembly.Memory / ArrayBuffer)</text>
    
    <!-- Ячейки памяти -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="60" height="50" fill="#fff" stroke="#1f2328"/>
      <text x="30" y="24" font-family="ui-monospace, monospace" font-size="12" fill="#0969da" text-anchor="middle">0x00</text>
      <text x="30" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#59636e" text-anchor="middle">[байт]</text>

      <rect x="60" y="0" width="60" height="50" fill="#fff" stroke="#1f2328"/>
      <text x="90" y="24" font-family="ui-monospace, monospace" font-size="12" fill="#0969da" text-anchor="middle">0x01</text>
      <text x="90" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#59636e" text-anchor="middle">[байт]</text>

      <rect x="120" y="0" width="60" height="50" fill="#fff" stroke="#1f2328"/>
      <text x="150" y="24" font-family="ui-monospace, monospace" font-size="12" fill="#0969da" text-anchor="middle">0x02</text>
      <text x="150" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#59636e" text-anchor="middle">[байт]</text>

      <rect x="180" y="0" width="70" height="50" fill="#eaeef2" stroke="#1f2328" stroke-dasharray="3,3"/>
      <text x="215" y="30" font-family="ui-monospace, monospace" font-size="14" fill="#59636e" text-anchor="middle">...</text>

      <rect x="250" y="0" width="80" height="50" fill="#fff" stroke="#1f2328"/>
      <text x="290" y="24" font-family="ui-monospace, monospace" font-size="12" fill="#0969da" text-anchor="middle">0xFFFF</text>
      <text x="290" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#59636e" text-anchor="middle">[байт N]</text>

      <rect x="330" y="0" width="70" height="50" fill="#ffebe9" stroke="#cf222e"/>
      <text x="365" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#cf222e" text-anchor="middle">Память ОС</text>
      <text x="365" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#cf222e" text-anchor="middle">[Защищено]</text>
    </g>

    <text x="20" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#1f2328">• Управление: ручное (malloc/free в C, borrow-checker в Rust)</text>
    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#1f2328">• Нет сборщика мусора (GC) в ядре | Защита от переполнения (Trap)</text>
  </g>

  <!-- Блок 2: Стековая машина -->
  <g transform="translate(470, 10)">
    <rect width="370" height="180" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="185" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Стековая машина (Stack VM)</text>
    <text x="185" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#59636e" text-anchor="middle">LIFO: без регистров процессора</text>

    <!-- Иллюстрация стека -->
    <g transform="translate(35, 65)">
      <rect x="0" y="40" width="100" height="24" fill="#ffffff" stroke="#1f2328"/>
      <text x="50" y="56" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">парам. $a (10)</text>

      <rect x="0" y="16" width="100" height="24" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
      <text x="50" y="32" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" text-anchor="middle">конст. 1</text>
    </g>

    <!-- Стрелка операции -->
    <path d="M 155 100 L 195 100" stroke="#000" stroke-width="1.5" marker-end="url(#arr2)"/>
    <text x="175" y="90" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#2da44e" text-anchor="middle">i32.sub</text>

    <!-- Стек результат -->
    <g transform="translate(225, 65)">
      <rect x="0" y="40" width="100" height="24" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
      <text x="50" y="56" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#1f2328" text-anchor="middle">результат (9)</text>
    </g>

    <text x="25" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#1f2328">• 4 типа данных: i32, i64, f32, f64 (нет строк/объектов)</text>
    <text x="25" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#1f2328">• Вызовы функций через стек: положить -> вызов -> забрать</text>
  </g>
</svg>
